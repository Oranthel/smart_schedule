name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      notes:
        description: 构建备注（可选）
        required: false
        default: ''
        type: string

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-apk:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Make gradlew executable & fix line endings
        run: |
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

      - name: Show project structure
        run: |
          echo "=== Project root ==="
          ls -la
          echo ""
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== app/build.gradle.kts (buildTypes section) ==="
          grep -A 20 "buildTypes" app/build.gradle.kts 2>/dev/null || echo "(not found)"

      - name: Validate Gradle wrapper can launch
        run: |
          set -e
          echo "=== gradle/wrapper contents ==="
          ls -la gradle/wrapper/
          echo ""
          echo "=== Run ./gradlew --version (sanity check wrapper) ==="
          ./gradlew --version

      - name: Build APK (${{ inputs.build_type }})
        run: |
          set -euo pipefail
          LOGFILE="build-${{ inputs.build_type }}.log"
          if [ "${{ inputs.build_type }}" = "release" ]; then
            echo "--- Building RELEASE APK ---"
            set +e
            ./gradlew assembleRelease --stacktrace --info > "$LOGFILE" 2>&1
            RC=$?
            set -e
          else
            echo "--- Building DEBUG APK ---"
            set +e
            ./gradlew assembleDebug --stacktrace --info > "$LOGFILE" 2>&1
            RC=$?
            set -e
          fi
          echo ""
          echo "--- Last 400 lines of build output (exit code: $RC) ---"
          tail -n 400 "$LOGFILE" || true
          echo ""
          if [ "$RC" -ne 0 ]; then
            echo "=== GRADLE BUILD FAILED (exit=$RC) ==="
            echo "--- First 100 lines for context ---"
            head -n 100 "$LOGFILE" || true
            exit "$RC"
          fi
          echo "=== GRADLE BUILD SUCCESSFUL ==="

      - name: List build outputs (detailed)
        if: always()
        run: |
          echo "=================================================="
          echo "=== Recursive list of app/build/outputs/ ==="
          echo "=================================================="
          find app/build/outputs -type f 2>/dev/null | sort || echo "(outputs directory not found)"

          echo ""
          echo "=================================================="
          echo "=== APK directory: ${{ inputs.build_type }} ==="
          echo "=================================================="
          ls -laR "app/build/outputs/apk/${{ inputs.build_type }}/" 2>/dev/null \
            || echo "(apk/${{ inputs.build_type }} directory not found)"

          echo ""
          echo "=================================================="
          echo "=== Try output-metadata.json ==="
          echo "=================================================="
          METADATA="app/build/outputs/apk/${{ inputs.build_type }}/output-metadata.json"
          if [ -f "$METADATA" ]; then
            cat "$METADATA"
          else
            echo "(output-metadata.json not found, checking all...)"
            find app/build/outputs -name "output-metadata.json" -exec cat {} \; 2>/dev/null \
              || echo "(no output-metadata.json anywhere)"
          fi

      - name: Locate & copy APK artifact (simple shell approach)
        id: locate-apk
        if: always()
        run: |
          BUILD_DIR="app/build/outputs/apk/${{ inputs.build_type }}"
          APK_FOUND=""
          APK_COPIED_NAME="app-${{ inputs.build_type }}.apk"
          mkdir -p artifact-apk

          echo "--- Listing files in $BUILD_DIR ---"
          if [ -d "$BUILD_DIR" ]; then
            ls -la "$BUILD_DIR"
          else
            echo "(BUILD_DIR does not exist)"
          fi

          # 1) Try exact known name first
          EXACT="$BUILD_DIR/app-${{ inputs.build_type }}.apk"
          echo ""
          echo "(Check 1) Exact name $EXACT ..."
          if [ -f "$EXACT" ]; then
            APK_FOUND="$EXACT"
            echo "  -> HIT"
          fi

          # 2) Look for any signed (non-unsigned) apk in build dir
          if [ -z "$APK_FOUND" ]; then
            echo "(Check 2) Looking for signed *.apk in $BUILD_DIR ..."
            for f in "$BUILD_DIR"/*.apk; do
              [ -f "$f" ] || continue
              case "$f" in
                *-unsigned.apk) ;;
                *) APK_FOUND="$f"; echo "  -> HIT: $f"; break ;;
              esac
            done
          fi

          # 3) Take unsigned if still nothing
          if [ -z "$APK_FOUND" ]; then
            echo "(Check 3) Taking any *.apk in $BUILD_DIR (including -unsigned) ..."
            for f in "$BUILD_DIR"/*.apk; do
              [ -f "$f" ] || continue
              APK_FOUND="$f"
              echo "  -> HIT: $f"
              case "$f" in
                *-unsigned.apk) APK_COPIED_NAME="app-${{ inputs.build_type }}-unsigned.apk" ;;
              esac
              break
            done
          fi

          # 4) Recurse whole outputs tree as last resort
          if [ -z "$APK_FOUND" ]; then
            echo "(Check 4) Recursive find under app/build/ ..."
            FOUND=$(find app/build -name "*.apk" -type f 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
              APK_FOUND="$FOUND"
              echo "  -> HIT via find: $FOUND"
              case "$FOUND" in
                *-unsigned.apk) APK_COPIED_NAME="app-${{ inputs.build_type }}-unsigned.apk" ;;
              esac
            fi
          fi

          echo ""
          echo "APK_FOUND=$APK_FOUND"

          if [ -n "$APK_FOUND" ] && [ -f "$APK_FOUND" ]; then
            echo "--- FOUND APK: $APK_FOUND ---"
            ls -la "$APK_FOUND"
            cp -f "$APK_FOUND" "artifact-apk/$APK_COPIED_NAME"
            echo "apk-path=artifact-apk/$APK_COPIED_NAME" >> "$GITHUB_OUTPUT"
            echo "apk-name=$APK_COPIED_NAME" >> "$GITHUB_OUTPUT"
            echo "status=found" >> "$GITHUB_OUTPUT"
            echo ""
            echo "--- artifact-apk/ contents ---"
            ls -la artifact-apk/
          else
            echo "--- NO APK FOUND IN BUILD OUTPUTS ---"
            echo "status=not-found" >> "$GITHUB_OUTPUT"
            echo ""
            echo "--- Check if gradle build task ran successfully above (look for BUILD SUCCESSFUL / BUILD FAILED)"
          fi

      - name: Fail if no APK was located
        if: always() && steps.locate-apk.outputs.status != 'found'
        run: |
          echo "======================================"
          echo "APK 未生成！请检查上面 'Build APK' 步骤的输出"
          echo "是否有 BUILD SUCCESSFUL 字样？"
          echo "如果没有，说明 Gradle 编译失败了（即使步骤看起来是绿的也可能被 tail 截断）"
          echo "======================================"
          exit 1

      - name: Upload APK artifact (from artifact-apk/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}-apk
          path: artifact-apk/
          retention-days: 30
          if-no-files-found: error

      - name: Upload APK artifact (fallback: direct glob)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}-apk-glob
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build logs always
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-outputs
          path: |
            app/build/reports/
            app/build/outputs/
          retention-days: 7
          if-no-files-found: ignore
