name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fix gradlew line endings (Windows CRLF → LF)
        run: sed -i 's/\r$//' gradlew

      - name: List project structure (debug)
        run: ls -la

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tail -200
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -300

      - name: List build outputs (recursive)
        if: always()
        run: |
          echo "=== Recursive listing of app/build/outputs/apk/ ==="
          find app/build/outputs/apk/ -type f 2>/dev/null || echo "No apk directory found"
          echo ""
          echo "=== Listing of app/build/outputs/ ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs directory found"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_id }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn

  release:
    name: Build Release APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fix gradlew line endings (Windows CRLF → LF)
        run: sed -i 's/\r$//' gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --info 2>&1 | tail -300

      - name: List build outputs (recursive)
        if: always()
        run: |
          echo "=== Recursive listing of app/build/outputs/apk/ ==="
          find app/build/outputs/apk/ -type f 2>/dev/null || echo "No apk directory found"
          echo ""
          echo "=== Listing of app/build/outputs/ ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "No outputs directory found"

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_id }}
          path: app/build/outputs/apk/**/*.apk
          retention-days: 90
          if-no-files-found: warn
