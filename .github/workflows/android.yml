name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fix gradlew line endings (Windows CRLF → LF)
        run: sed -i 's/\r$//' gradlew

      - name: List project structure (debug)
        run: ls -la

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --info 2>&1 | tail -200
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -300

      - name: List build outputs (debug)
        if: always()
        run: ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ github.run_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  release:
    name: Build Release APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Fix gradlew line endings (Windows CRLF → LF)
        run: sed -i 's/\r$//' gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --info 2>&1 | tail -300

      - name: List build outputs (release)
        if: always()
        run: ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release APK found"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_id }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
